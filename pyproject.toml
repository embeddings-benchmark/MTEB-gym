[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mteb-gym"
version = "0.3.0"
description = "Evaluate embedding models on any corpus, without relevance labels"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MTEB Contributors" }]
keywords = ["embeddings", "retrieval", "evaluation", "benchmark", "mteb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mteb[bm25s]>=2.20,<3",
    "openai>=1.40",
    "httpx2>=2.0.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2",
    "huggingface_hub>=2.0",
    "datasets>=2.19",
    "transformers>=4.57,<6",  # the oldest tested; models loaded here are passed `dtype`
    "peft>=0.18",
    "accelerate>=1",
    "packaging",
]

[project.optional-dependencies]
colbert = ["mteb[pylate]>=2.20,<3"]
decider = ["decider-ai>=1.10,<2"]
transformers5 = ["transformers>=5,<6"]  # the judges whose architecture is newer than transformers 4
leaderboard = ["gradio>=6,<7"]

[project.urls]
Homepage = "https://github.com/embeddings-benchmark/MTEB-gym"
Repository = "https://github.com/embeddings-benchmark/MTEB-gym"
Results = "https://github.com/embeddings-benchmark/gym-results"

[project.scripts]
mteb-gym = "mteb_gym.cli:main"

[dependency-groups]
test = ["pytest>=8"]
dev = [{ include-group = "test" }, "ruff"]
typing = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "scipy-stubs>=1.17.1.5",
    "types-tqdm>=4.70.0.20261106",
]

[tool.setuptools]
packages = ["mteb_gym", "mteb_gym.benchmarks", "mteb_gym.benchmarks.benchmarks", "mteb_gym.leaderboard", "mteb_gym.models", "mteb_gym.models.model_implementations"]

[tool.setuptools.package-data]
mteb_gym = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "E", "W", "UP"]
ignore = ["E501"]   # the formatter owns line length

[tool.mypy]
python_version = "3.11"
files = ["mteb_gym"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
# datasets has no typing marker; these integrations are optional at runtime.
module = ["datasets.*", "decider.*", "gradio.*"]
ignore_missing_imports = true
