name: Test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Cache Hugging Face
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install
      - name: Test
        env:
          TQDM_DISABLE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TRANSFORMERS_VERBOSITY: error
        run: make test

  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
      - name: Test against the newest allowed dependencies
        env:
          TQDM_DISABLE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TRANSFORMERS_VERBOSITY: error
        run: |
          uv venv
          uv pip install -U . pytest
          uv run --no-project pytest -q
